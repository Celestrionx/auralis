name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            target_name: linux-amd64
            archive_ext: tar.gz
            bin_name: auralis
          - runner: macos-latest
            rust_target: aarch64-apple-darwin
            target_name: darwin-arm64
            archive_ext: tar.gz
            bin_name: auralis
          - runner: macos-13
            rust_target: x86_64-apple-darwin
            target_name: darwin-amd64
            archive_ext: tar.gz
            bin_name: auralis
          - runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            target_name: windows-amd64
            archive_ext: zip
            bin_name: auralis.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Package Binary & Bundled SoundFont
        shell: bash
        run: |
          mkdir -p stage/assets/soundfonts dist
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.bin_name }}" stage/
          cp assets/soundfonts/TimGM6mb.sf2 stage/assets/soundfonts/
          cp README.md LICENSE stage/
          archive="auralis-${{ matrix.target_name }}.${{ matrix.archive_ext }}"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            (cd stage && 7z a "../dist/${archive}" .)
          else
            tar -C stage -czf "dist/${archive}" .
          fi
          (cd dist && sha256sum "${archive}" > "${archive}.sha256")

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auralis-${{ matrix.target_name }}
          path: dist/*
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble Checksums
        run: |
          cd dist
          cat *.sha256 > checksums.txt
          rm -f *.sha256
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
