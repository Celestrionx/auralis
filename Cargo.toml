[package]
name = "auralis"
version = "0.2.1"
edition = "2024"
authors = ["WinPhay"]
description = "Headless Audio Graph Compiler & Auditory Telemetry Engine for Autonomous Agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Celestrionx/auralis"
homepage = "https://github.com/Celestrionx/auralis"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
rustfft = "6.2"
rustysynth = "1.3"

[dev-dependencies]
